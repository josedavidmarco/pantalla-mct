  .naranja .aemet-badge { background:#ed8936; color:#fff; }

var fsBtn = document.getElementById('fs-btn');

function toggleFullscreen() {
  var doc = document.documentElement;
  var isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (!isFS) {
    var request = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
    if (request) {
      try { request.call(doc); if (fsBtn) fsBtn.className += ' hidden'; } catch (e) {}
    }
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) { try { exit.call(document); } catch (e) {} }
  }
}

function onFullscreenChange() {
  var isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (!fsBtn) return;
  if (isFS) { fsBtn.className = fsBtn.className.replace(/\s*hidden/g, ''); fsBtn.className += ' hidden'; }
  else { fsBtn.className = fsBtn.className.replace(/\s*hidden/g, ''); }
}
document.addEventListener('fullscreenchange', onFullscreenChange, false);
document.addEventListener('webkitfullscreenchange', onFullscreenChange, false);
document.addEventListener('mozfullscreenchange', onFullscreenChange, false);
document.addEventListener('MSFullscreenChange', onFullscreenChange, false);

function xhrJSON(url, callback, noCache) {
  var xhr = new XMLHttpRequest();
  var finalUrl = url;
  if (noCache) finalUrl += (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + new Date().getTime();
  xhr.open('GET', finalUrl, true);

    if (xhr.readyState !== 4) return;
    if (xhr.status >= 200 && xhr.status < 300) {
      try { callback(null, JSON.parse(xhr.responseText)); } catch (e) { callback(e); }
    } else callback(new Error('HTTP ' + xhr.status));
  };
  xhr.onerror = function() { callback(new Error('Network error')); };
  try { xhr.send(); } catch(e) { callback(e); }
}

function fetchWeatherForCity(city, callback) {

function renderWeather(city,data) {
  if (!data || !data.current) return;
  var current=data.current, wd=weatherDescription(current.weather_code);
  elCity.textContent=city.name; elIcon.textContent=wd[0]; elTemp.textContent=Math.round(current.temperature_2m)+'°C'; elDesc.textContent=wd[1];

  if (elForecast && data.daily) {
    var days=data.daily.time||[], codes=data.daily.weather_code||[], maxs=data.daily.temperature_2m_max||[], mins=data.daily.temperature_2m_min||[], out='';
    for (var i=0;i<days.length;i++) {
      var d=new Date(days[i]+'T12:00:00'); var label=i===0?'Hoy':d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.',''); var ic=weatherDescription(codes[i])[0];
      out+='<div class="forecast-day"><div class="day-name">'+label+'</div><div class="day-condition"><span class="text">'+weatherDescription(codes[i])[1]+'</span></div><div class="day-temps"><span class="max">'+Math.round(maxs[i]||0)+'°</span><span class="min">'+Math.round(mins[i]||0)+'°</span></div></div>';

function updateWeatherCity(index, callback) {
  var city=CITIES[index]; if (!city) return;
  var cached=weatherCache[city.name], now=new Date().getTime();
  if (cached && now-cached._timestamp<WEATHER_REFRESH_MS) { renderWeather(city,cached); if(callback)callback(); return; }
  fetchWeatherForCity(city,function(err,data) {
    if (!err && data) { data._timestamp=new Date().getTime(); weatherCache[city.name]=data; renderWeather(city,data); }
    else { elCity.textContent=city.name; elDesc.textContent='Datos meteorológicos no disponibles'; }
    if(callback)callback();

  setInterval(function() { weatherCache={}; updateWeatherCity(currentCityIndex); fetchAemetAlerts(); }, WEATHER_REFRESH_MS);

var tickerTimer=null, tickerX=0, tickerLast=0, tickerResetWidth=0;
function startTicker(){
  if(tickerTimer){clearTimeout(tickerTimer);tickerTimer=null;}
  tickerX=0; tickerLast=new Date().getTime();
  tickerTrack.style.left='0px';
  setTimeout(function(){
    tickerResetWidth=Math.floor(tickerTrack.scrollWidth/2);
    tickerStep();
  },100);
}
function tickerStep(){
  var now=new Date().getTime(), elapsed=now-tickerLast;
  tickerLast=now;
  tickerX-=elapsed*0.085;
  if(tickerResetWidth>0 && -tickerX>=tickerResetWidth) tickerX=0;
  tickerTrack.style.left=Math.round(tickerX)+'px';
  tickerTimer=setTimeout(tickerStep,40);
}

function parseCSV(text) {
  var rows = [], row = [], cell = '', inQuotes = false;
  var i, ch, j, nonempty;
  for (i = 0; i < text.length; i++) {
    ch = text.charAt(i);
    if (ch === '"') {
      if (inQuotes && text.charAt(i + 1) === '"') { cell += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      row.push(cell); cell = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
      row.push(cell); cell = '';
      nonempty = false;
      for (j = 0; j < row.length; j++) {
        if (row[j].replace(/^\s+|\s+$/g, '') !== '') { nonempty = true; break; }
      }
      if (nonempty) rows.push(row);
      row = [];
    } else { cell += ch; }
  }
  if (cell !== '' || row.length) {
    row.push(cell); nonempty = false;
    for (j = 0; j < row.length; j++) if (row[j].replace(/^\s+|\s+$/g, '') !== '') { nonempty = true; break; }
    if (nonempty) rows.push(row);
  }
  if (!rows.length) return [];
  var headers = rows[0], out = [], obj, r;
  for (i = 0; i < headers.length; i++) headers[i] = headers[i].replace(/^\uFEFF/, '').replace(/^\s+|\s+$/g, '');
  for (r = 1; r < rows.length; r++) {
    obj = {};
    for (i = 0; i < headers.length; i++) obj[headers[i]] = (rows[r][i] || '').replace(/^\s+|\s+$/g, '');
    out.push(obj);
  }
  return out;
}
function escapeHTML(value){ return String(value===null||typeof value==='undefined'?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function driveImageURL(url){ if(!url)return ''; var m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/i)||url.match(/[?&]id=([^&]+)/i); return m?'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1920':url; }
function youtubeVideoID(url){ if(!url)return ''; var value=url.replace(/^\s+|\s+$/g,''),patterns=[/youtu\.be\/([^?&#/]+)/i,/youtube\.com\/watch\?[^#]*v=([^&#]+)/i,/youtube\.com\/embed\/([^?&#/]+)/i,/youtube\.com\/shorts\/([^?&#/]+)/i],i,m;for(i=0;i<patterns.length;i++){m=value.match(patterns[i]);if(m)return m[1];}return ''; }
function parseDateForSort(value){ var m=String(value||'').replace(/^\s+|\s+$/g,'').match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1])).getTime(); var t=Date.parse(value); return isNaN(t)?0:t; }

function buildSlides(news,videos){
  var container=document.getElementById('content-panel'),fragments=[],validNews=[],validVideos=[],i,item,image,videoId;
  for(i=0;i<news.length;i++)if(news[i].Titular||news[i].Subtítulo||news[i].Imagen_URL)validNews.push(news[i]);
  validNews.sort(function(a,b){return parseDateForSort(b.Fecha)-parseDateForSort(a.Fecha);});
  for(i=0;i<videos.length;i++)if(youtubeVideoID(videos[i].Youtube_URL) || isDirectVideoURL(videos[i].Youtube_URL))validVideos.push(videos[i]);

  for(i=0;i<validNews.length;i++){
    item=validNews[i]; image=driveImageURL(item.Imagen_URL);
    fragments.push('<div class="slide '+(fragments.length===0?'active':'')+'" data-type="news" data-duration="'+NEWS_DURATION_MS+'">'+
      (image?'<img class="news-bg" src="'+escapeHTML(image)+'" alt="'+escapeHTML(item.Titular||'Noticia')+'" data-cachebust>':'')+
      '<div class="news-overlay"></div><div class="news-text"><div class="news-kicker">'+escapeHTML(item.Antetítulo||'')+'</div><h2 class="news-title">'+escapeHTML(item.Titular||'')+'</h2><p class="news-subtitle">'+escapeHTML(item.Subtítulo||'')+'</p></div></div>');
  }
  for(i=0;i<validVideos.length;i++){
    item=validVideos[i]; videoId=youtubeVideoID(item.Youtube_URL);
    fragments.push('<div class="slide '+(fragments.length===0?'active':'')+'" data-type="video" data-video-id="'+escapeHTML(videoId)+'" data-video-url="'+escapeHTML(item.Youtube_URL||'')+'" data-video-title="'+escapeHTML(item.Título||'Vídeo')+'"><div class="video-placeholder"></div></div>');
  }
  if(!fragments.length){container.innerHTML='<div class="slides-loading">No hay contenido disponible.</div>';slides=[];return false;}
  container.innerHTML=fragments.join('');slides=container.querySelectorAll('.slide');currentSlideIndex=0;applyCacheBusting();scheduleNext(slides[0]);return true;
}

function fetchCSV(url,callback){
  xhrText(url,function(err,text){
    if(!err){try{callback(null,parseCSV(text));}catch(e){callback(e);}return;}
    /* Algunos navegadores antiguos pueden fallar con la URL de Google Sheets con parámetro de caché. Reintentamos sin él. */
    xhrText(url,function(err2,text2){
      if(err2){callback(err2);return;}
      try{callback(null,parseCSV(text2));}catch(e2){callback(e2);}
    },false);
  },true);
}
function loadDynamicContent(force){
  if(typeof force==='undefined')force=false;
  fetchCSV(NEWS_CSV_URL,function(err,news){if(err){handleContentError(err);return;}fetchCSV(VIDEOS_CSV_URL,function(err2,videos){if(err2){handleContentError(err2);return;}var signature=JSON.stringify({news:news,videos:videos});if(!force&&signature===contentSignature)return;contentSignature=signature;clearTimeout(slideTimeout);buildSlides(news,videos);});});
}
function handleContentError(err){if(!slides.length)document.getElementById('content-panel').innerHTML='<div class="slides-loading">No se ha podido cargar el contenido.</div>';}
function handleContentError(err){if(!slides.length)document.getElementById('content-panel').innerHTML='<div class="slides-loading">No se ha podido cargar el contenido.</div>';}
function isDirectVideoURL(url){
  if(!url)return false;
  return /\.(mp4|m4v|webm|ogg)(\?|#|$)/i.test(String(url));
}
function activateVideoSlide(slideElement){
  if(!slideElement || slideElement.getAttribute('data-type')!=='video')return;
  var placeholder=slideElement.getElementsByTagName('div')[0];
  if(!placeholder)return;
  if(placeholder.getElementsByTagName('video').length || placeholder.getElementsByTagName('iframe').length)return;
  var videoUrl=slideElement.getAttribute('data-video-url')||'';
  var videoId=slideElement.getAttribute('data-video-id')||'';
  var title=slideElement.getAttribute('data-video-title')||'Vídeo';

  /* SOLUCIÓN COMPATIBLE CON webOS 3.x:
     si la hoja contiene una URL directa .mp4/.m4v/.webm/.ogg, se reproduce
     con el reproductor HTML5 del propio televisor. Este es el método fiable
     para Chromium 38; el iframe moderno de YouTube no lo es. */
  if(isDirectVideoURL(videoUrl)){
    var video=document.createElement('video');
    video.className='html5-video';
    video.setAttribute('playsinline','true');
    video.setAttribute('autoplay','true');
    video.setAttribute('muted','true');
    video.setAttribute('loop','true');
    video.setAttribute('preload','auto');
    video.setAttribute('controls','false');
    video.title=title;
    video.src=videoUrl;
    video.volume=0;
    placeholder.appendChild(video);
    try{video.load();}catch(e){}
    try{video.play();}catch(e2){}
    return;
  }

  /* YouTube se conserva como compatibilidad de respaldo, pero en webOS 3.x
     el reproductor actual puede cargar y quedarse negro. */
  if(!videoId)return;
  var iframe=document.createElement('iframe');
  iframe.className='youtube-frame';
  iframe.setAttribute('frameborder','0');
  iframe.setAttribute('allowfullscreen','true');
  iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
  iframe.title=title;
  iframe.src='https://www.youtube.com/embed/'+encodeURIComponent(videoId)+'?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&fs=0&iv_load_policy=3&cc_load_policy=0';
  placeholder.appendChild(iframe);
}
function deactivateVideoSlide(slideElement){
  if(!slideElement)return;
  var placeholder=slideElement.getElementsByTagName('div')[0];
  if(!placeholder)return;
  var iframes=placeholder.getElementsByTagName('iframe');
  while(iframes.length){
    if(iframes[0]._mctRetryTimer) clearTimeout(iframes[0]._mctRetryTimer);
    placeholder.removeChild(iframes[0]);
  }
  var videos=placeholder.getElementsByTagName('video');
  while(videos.length){
    try{videos[0].pause();}catch(e){}
    videos[0].removeAttribute('src');
    try{videos[0].load();}catch(e2){}
    placeholder.removeChild(videos[0]);
  }
}
function rotateSlides(){
  if(!slides.length)return;
  var currentSlide=slides[currentSlideIndex];
  if(currentSlide){
    deactivateVideoSlide(currentSlide);
    currentSlide.className=currentSlide.className.replace(/\s*active/g,'');
  }
  currentSlideIndex=(currentSlideIndex+1)%slides.length;
  var nextSlide=slides[currentSlideIndex];
  nextSlide.className=nextSlide.className.replace(/\s*active/g,'')+' active';
  scheduleNext(nextSlide);
}
function scheduleNext(slideElement){
  clearTimeout(slideTimeout);
  if(!slideElement)return;
  var type=slideElement.getAttribute('data-type');
  if(type==='video'){
    activateVideoSlide(slideElement);
    slideTimeout=setTimeout(rotateSlides,VIDEO_DURATION_MS);
  }else{
    var duration=parseInt(slideElement.getAttribute('data-duration'),10)||8000;
    slideTimeout=setTimeout(rotateSlides,duration);
  }
}
