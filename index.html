// SISTEMA ROBUSTO DE PANTALLA COMPLETA (MÓVILES / SMART TV / PC)
// ---------------------------------------------------------------
const fsBtn = document.getElementById('fs-btn');

function toggleFullscreen() {
  const doc = document.documentElement;
  const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

  if (!isFS) {
    const request = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
    if (request) {
      request.call(doc).then(() => {
        fsBtn.classList.add('hidden');
      }).catch(err => {
        console.warn("Fullscreen bloqueado por el navegador:", err);
      });
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) {
      exit.call(document);
    }
  }
}

// Escuchar cambios de estado en pantalla completa para ocultar/mostrar botón
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, () => {
    const isFS = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFS) {
      fsBtn.classList.add('hidden');
    } else {
      fsBtn.classList.remove('hidden');
    }
  });
});

// Listener táctil directo
fsBtn.addEventListener('click', toggleFullscreen);

// Intento en el primer toque de pantalla
const autoFSHandler = () => {
  toggleFullscreen();
  ['click', 'touchstart'].forEach(e => document.removeEventListener(e, autoFSHandler));
};
['click', 'touchstart'].forEach(e => document.addEventListener(e, autoFSHandler, { once: true }));

function applyCacheBusting() {
  // Usamos el instante exacto de carga (milisegundos), no solo la
  // fecha del día. Con la fecha, si actualizabas una noticia y la
  // comprobabas el mismo día, la URL generada era idéntica a la de
  // antes (mismo "v=20260721"), así que el navegador servía la copia
  // ya cacheada en vez de descargar la nueva. Con la marca de tiempo
  // exacta, cada recarga de la página (manual o la automática de las
  // 4:00 AM) genera una URL distinta y fuerza siempre una descarga
  // fresca de imágenes, vídeos y logos.
  const version = Date.now();

  const bust = (url) => {
    if (!url) return url;
    const sep = url.includes('?') ? '&' : '?';
    return `${url}${sep}v=${version}`;
  };

  document.querySelectorAll('img[data-cachebust]').forEach(el => {
    el.setAttribute('src', bust(el.getAttribute('src')));
  });

  document.querySelectorAll('video[data-cachebust]').forEach(el => {
    el.setAttribute('data-src', bust(el.getAttribute('data-src')));
  });
}

function decodeHTML(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  return doc.body.textContent || "";
}

async function loadRSS(){
  try{
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent("https://www.europapress.es/rss/rss.aspx?ch=66")}`);
    const data = await res.json();
    if(data.status !== "ok" || !data.items.length) throw new Error();
    const headlines = data.items.slice(0, 12).map(it => decodeHTML(it.title));
    tickerTrack.innerHTML = headlines.concat(headlines).map(h => `<span class="item">${h}</span>`).join('');
    requestAnimationFrame(() => {
      tickerTrack.style.animationDuration = Math.max(20, (tickerTrack.scrollWidth / 2) / 85) + "s";
    });
  }catch(err){ tickerTrack.innerHTML = `<span class="item">Actualizando noticias...</span>`; }
}

const RELOAD_HOUR = 4;
const RELOAD_MINUTE = 0;

function scheduleAutoReload() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), RELOAD_HOUR, RELOAD_MINUTE, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  const msUntilReload = next.getTime() - now.getTime();
  setTimeout(() => { window.location.reload(); }, msUntilReload);
}

const NEWS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDgXkCTepu3GbZ9G7T_s-qheD0AnQ1JVwDZronL3eYM50z4eCnFcz-ArDSbEJRuqJB50WHczyVfO4T/pub?gid=0&single=true&output=csv";
const VIDEOS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDgXkCTepu3GbZ9G7T_s-qheD0AnQ1JVwDZronL3eYM50z4eCnFcz-ArDSbEJRuqJB50WHczyVfO4T/pub?gid=797206478&single=true&output=csv";
const CONTENT_REFRESH_MS = 10 * 60 * 1000;
const NEWS_DURATION_MS = 20000;

let slides = [];
let currentSlideIndex = 0;
let slideTimeout = null;
let youtubePlayers = {};
let youtubeReady = false;
let contentSignature = "";
let youtubeApiLoading = false;

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') { cell += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      row.push(cell); cell = "";
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
    } else cell += ch;
  }
  if (cell !== "" || row.length) {
    row.push(cell);
    if (row.some(v => v.trim() !== "")) rows.push(row);
  }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim());
  return rows.slice(1).map(values => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] || "").trim());
    return obj;
  });
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function driveImageURL(url) {
  if (!url) return "";
  const match = url.match(/drive\.google\.com\/file\/d\/([^/]+)/i) || url.match(/[?&]id=([^&]+)/i);
  if (match) return `https://drive.google.com/thumbnail?id=${encodeURIComponent(match[1])}&sz=w1920`;
  return url;
}

function youtubeVideoID(url) {
  if (!url) return "";
  const value = url.trim();
  const patterns = [
    /youtu\.be\/([^?&#/]+)/i,
    /youtube\.com\/watch\?[^#]*v=([^&#]+)/i,
    /youtube\.com\/embed\/([^?&#/]+)/i,
    /youtube\.com\/shorts\/([^?&#/]+)/i
  ];
  for (const pattern of patterns) {
    const match = value.match(pattern);
    if (match) return match[1];
  }
  return "";
}

function parseDateForSort(value) {
  const m = String(value || "").trim().match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
  const t = Date.parse(value);
  return Number.isNaN(t) ? 0 : t;
}

function ensureYouTubeAPI() {
  if (youtubeReady || youtubeApiLoading || window.YT) return;
  youtubeApiLoading = true;
  window.onYouTubeIframeAPIReady = () => { youtubeReady = true; initializeVisibleYouTubePlayer(); };
  const script = document.createElement('script');
  script.src = 'https://www.youtube.com/iframe_api';
  script.async = true;
  document.head.appendChild(script);
}

function initializeVisibleYouTubePlayer() {
  const slide = slides[currentSlideIndex];
  if (!slide || slide.dataset.type !== 'video') return;
  const iframe = slide.querySelector('iframe.youtube-frame');
  if (!iframe || !window.YT || !YT.Player) return;
  const id = iframe.id;
  if (youtubePlayers[id]) return;
  youtubePlayers[id] = new YT.Player(id, {
    events: {
      onReady: event => {
        try { event.target.mute(); event.target.playVideo(); } catch(e) {}
      },
      onStateChange: event => {
        if (event.data === YT.PlayerState.ENDED) rotateSlides();
      },
      onError: () => { slideTimeout = setTimeout(rotateSlides, 5000); }
    }
  });
}

function destroyYouTubePlayers() {
  Object.values(youtubePlayers).forEach(player => {
    try { player.destroy(); } catch(e) {}
  });
  youtubePlayers = {};
}

function buildSlides(news, videos) {
  const container = document.getElementById('content-panel');
  const fragments = [];
  const validNews = news.filter(n => n.Titular || n.Subtítulo || n.Imagen_URL)
    .sort((a,b) => parseDateForSort(b.Fecha) - parseDateForSort(a.Fecha));
  const validVideos = videos.filter(v => youtubeVideoID(v.Youtube_URL));

  validNews.forEach((item, index) => {
    const image = driveImageURL(item.Imagen_URL);
    fragments.push(`<div class="slide ${fragments.length === 0 ? 'active' : ''}" data-type="news" data-duration="${NEWS_DURATION_MS}">
      ${image ? `<img class="news-bg" src="${escapeHTML(image)}" alt="${escapeHTML(item.Titular || 'Noticia')}" data-cachebust>` : ''}
      <div class="news-overlay"></div>
      <div class="news-text">
        <div class="news-kicker">${escapeHTML(item.Antetítulo || '')}</div>
        <h2 class="news-title">${escapeHTML(item.Titular || '')}</h2>
        <p class="news-subtitle">${escapeHTML(item.Subtítulo || '')}</p>
      </div>
    </div>`);
  });

  validVideos.forEach((item, index) => {
    const videoId = youtubeVideoID(item.Youtube_URL);
    const iframeId = `yt-player-${Date.now()}-${index}`;
    fragments.push(`<div class="slide ${fragments.length === 0 ? 'active' : ''}" data-type="video" data-video-id="${escapeHTML(videoId)}">
      <iframe id="${iframeId}" class="youtube-frame" src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1" title="${escapeHTML(item.Título || 'Vídeo')}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>`);
  });

  if (!fragments.length) {
    container.innerHTML = '<div class="slides-loading">No hay contenido disponible.</div>';
    slides = [];
    return false;
  }

  container.innerHTML = fragments.join('');
  slides = Array.from(container.querySelectorAll('.slide'));
  currentSlideIndex = 0;
  applyCacheBusting();
  ensureYouTubeAPI();
  scheduleNext(slides[0]);
  return true;
}

async function fetchCSV(url) {
  const response = await fetch(url + '&_=' + Date.now(), { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return parseCSV(await response.text());
}

async function loadDynamicContent(force = false) {
  try {
    const [news, videos] = await Promise.all([fetchCSV(NEWS_CSV_URL), fetchCSV(VIDEOS_CSV_URL)]);
    const signature = JSON.stringify({ news, videos });
    if (!force && signature === contentSignature) return;

    // Si el contenido ya está cargado y no ha cambiado, no se toca la reproducción.
    contentSignature = signature;
    clearTimeout(slideTimeout);
    destroyYouTubePlayers();
    buildSlides(news, videos);
  } catch (err) {
    console.warn('No se pudo actualizar el contenido de Google Sheets:', err);
    // No destruimos el contenido que ya está funcionando si una actualización falla.
    if (!slides.length) {
      document.getElementById('content-panel').innerHTML = '<div class="slides-loading">No se ha podido cargar el contenido.</div>';
    }
  }
}

function rotateSlides(){
  if (!slides.length) return;
  const currentSlide = slides[currentSlideIndex];
  if (currentSlide) {
    currentSlide.classList.remove('active');
    const iframe = currentSlide.querySelector('iframe.youtube-frame');
    if (iframe && youtubePlayers[iframe.id]) {
      try { youtubePlayers[iframe.id].pauseVideo(); } catch(e) {}
    }
  }

  currentSlideIndex = (currentSlideIndex + 1) % slides.length;
  const nextSlide = slides[currentSlideIndex];
  nextSlide.classList.add('active');
  scheduleNext(nextSlide);
}

function scheduleNext(slideElement) {
  clearTimeout(slideTimeout);
  if (!slideElement) return;
  const type = slideElement.getAttribute('data-type');

  if (type === 'video') {
    ensureYouTubeAPI();
    const iframe = slideElement.querySelector('iframe.youtube-frame');
    if (!iframe) { slideTimeout = setTimeout(rotateSlides, 5000); return; }

    if (youtubeReady && window.YT && YT.Player) {
      initializeVisibleYouTubePlayer();
      const player = youtubePlayers[iframe.id];
      if (player) {
        try { player.mute(); player.playVideo(); } catch(e) {}
      }
    }
    // Seguridad: si YouTube no comunica el final, no bloqueamos el carrusel.
    slideTimeout = setTimeout(rotateSlides, 10 * 60 * 1000);
  } else {
    const duration = parseInt(slideElement.getAttribute('data-duration')) || 8000;
    slideTimeout = setTimeout(rotateSlides, duration);
  }
}
